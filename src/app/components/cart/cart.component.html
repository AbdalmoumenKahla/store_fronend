<div class="cart-container">
  <h1>Shopping Cart</h1>

  <div *ngIf="cartItems.length === 0" class="empty-cart">
    <p>Your cart is empty</p>
    <a routerLink="/" class="btn btn-primary">Continue Shopping</a>
  </div>

  <div *ngIf="cartItems.length > 0" class="cart-content">
    <div class="cart-items">
      <div class="cart-header">
        <div class="col col-product">Product</div>
        <div class="col col-price">Price</div>
        <div class="col col-quantity">Quantity</div>
        <div class="col col-total">Total</div>
        <div class="col col-action">Action</div>
      </div>

      <div *ngFor="let item of cartItems">
        <app-cart-item
          [cartItem]="item"
          (removeItem)="removeItem($event)"
          (updateQuantity)="updateQuantity($event)"
        >
        </app-cart-item>
      </div>
    </div>

    <div class="cart-summary">
      <div class="summary-row">
        <span class="label">Subtotal:</span>
        <span class="value">${{ cartTotal.toFixed(2) }}</span>
      </div>
      <div class="summary-row">
        <span class="label">Shipping:</span>
        <span class="value">Free</span>
      </div>
      <div class="summary-row total">
        <span class="label">Total:</span>
        <span class="value">${{ cartTotal.toFixed(2) }}</span>
      </div>

      <div class="cart-actions">
        <button (click)="clearCart()" class="btn btn-secondary">Clear Cart</button>
        <a routerLink="/checkout" class="btn btn-primary">Proceed to Checkout</a>
      </div>
    </div>
  </div>
</div>
